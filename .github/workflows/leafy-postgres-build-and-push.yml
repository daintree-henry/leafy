name: Postgres Build and Push

on:
  push:
    branches:
      - 08-cicd  
      # The workflow runs when changes are pushed to the 08-cicd branch.
    paths:
      - 'leafy-postgres/**'

jobs:
  build-and-push:
    runs-on: ubuntu-latest  
    # Use the latest Ubuntu runner.

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v2  
      # Check out the current repository.

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v1  
      # Set up Docker Buildx.

    - name: Login to Docker Hub
      uses: docker/login-action@v1
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}  
        # Read the Docker Hub username from a GitHub secret.
        password: ${{ secrets.DOCKERHUB_TOKEN }}     
        # Read the Docker Hub access token from a GitHub secret.

    - name: Build and Push
      uses: docker/build-push-action@v2
      with:
        context: ./leafy-postgresql  
        # Directory that contains the Dockerfile.
        file: ./leafy-postgresql/Dockerfile  
        # Path to the Dockerfile.
        push: true  
        # Push the image to the registry.
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/leafy-postgres:${{ github.sha }}

