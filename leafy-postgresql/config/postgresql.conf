# POSTGRESQL.CONF FILE
# ---------------------

# CONNECTIONS AND AUTHENTICATION
listen_addresses = '*'        # Accept connections on an IP address or host name; '*' allows all IPs.
max_connections = 100         # Maximum number of concurrent connections
authentication_timeout = 5min   # Authentication timeout (5 minutes)
password_encryption = md5     # Password encryption method

# QUERY TUNING
work_mem = 64MB              # Memory available to each connection
shared_buffers = 256MB       # Shared memory buffer size
effective_cache_size = 2GB   # Memory used for maintenance tasks such as creating indexes

# ERROR REPORTING AND LOGGING
log_destination = 'stderr'   # Log output destination
logging_collector = on        # Enable the logging collector
log_directory = 'pg_log'     # Directory where log files are stored
log_filename = 'postgresql-%a.log'  # Log file name

# REPLICATION
wal_level = replica          # Streaming replication settings
max_wal_senders = 5          # Maximum number of WAL sender processes

# PERFORMANCE
effective_io_concurrency = 200   # Number of concurrent disk I/O operations
random_page_cost = 1.1           # Cost of a random page access, considered for index scans
